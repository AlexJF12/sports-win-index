<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog — Team Wins</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
<style>
  :root {
    color-scheme: light;
    --page:           #f9f9f7;
    --surface:        #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --hairline:       #e1e0d9;
    --border:         rgba(11, 11, 11, 0.10);
    --hot:            #2a78d6;
    --cold:           #e34948;
    --chip:           rgba(11, 11, 11, 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page:           #0d0d0d;
      --surface:        #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --hairline:       #2c2c2a;
      --border:         rgba(255, 255, 255, 0.10);
      --hot:            #6ba6e8;
      --cold:           #f07b7a;
      --chip:           rgba(255, 255, 255, 0.06);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 20px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 20px; font-weight: 650; margin: 0; }
  nav { display: flex; gap: 16px; }
  nav a { color: var(--text-secondary); font-size: 13px; text-decoration: none; }
  nav a:hover { text-decoration: underline; }
  nav [aria-current="page"] { color: var(--text-primary); font-size: 13px; font-weight: 650; }
  .as-of { color: var(--text-muted); font-size: 13px; margin: 6px 0 0; }
  a { color: var(--text-primary); }

  /* filter chips */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 4px; }
  .filters button {
    font: inherit; font-size: 13px; color: var(--text-secondary);
    background: var(--chip); border: 1px solid transparent; border-radius: 999px;
    padding: 5px 12px; cursor: pointer;
  }
  .filters button:hover { color: var(--text-primary); }
  .filters button[aria-pressed="true"] {
    color: var(--text-primary); font-weight: 600;
    background: var(--surface); border-color: var(--border);
  }

  /* one heading per day, however many runs it carries */
  .day { margin-top: 30px; }
  .day-head { font-size: 13px; font-weight: 650; letter-spacing: 0.02em; margin: 0 0 8px; }
  .day-head a { color: var(--text-muted); text-decoration: none; }
  .day-head a:hover { color: var(--text-primary); }
  .day:target > .day-head a, .post:target .badge { color: var(--text-primary); }

  .post {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; margin: 10px 0;
    scroll-margin-top: 16px;
  }
  .post:target { border-color: var(--text-muted); }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    font-size: 11px; font-weight: 650; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--text-secondary); background: var(--chip);
    border-radius: 999px; padding: 3px 10px; margin-bottom: 10px;
  }
  .badge:hover { color: var(--text-primary); }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); }
  .badge[data-kind="daily"]::before { background: var(--hot); }
  .badge[data-kind="spotlight"]::before { background: var(--cold); }
  .badge[data-kind="streakiness"]::before { background: var(--text-secondary); }
  .post h3 { font-size: 19px; font-weight: 650; line-height: 1.3; margin: 0 0 4px; }
  .dek { color: var(--text-secondary); font-size: 14px; margin: 0; }

  .finding { margin-top: 24px; }
  .finding + .finding { border-top: 1px solid var(--hairline); padding-top: 22px; }
  .finding h4 { font-size: 16px; font-weight: 650; line-height: 1.35; margin: 0 0 4px; }
  .subhead { color: var(--text-muted); font-size: 13px; margin: 0 0 4px; }

  figure { margin: 14px 0 0; }
  figure button {
    display: block; position: relative; width: 100%; padding: 0; border: 0;
    background: none; cursor: zoom-in; border-radius: 10px; overflow: hidden;
  }
  figure img {
    display: block; width: 100%; height: auto;
    border: 1px solid var(--hairline); border-radius: 10px; background: #fcfcfb;
  }
  /* charts are dense; on a phone the tap-to-enlarge is the whole story */
  figure button::after {
    content: "⤢"; position: absolute; top: 8px; right: 8px;
    width: 24px; height: 24px; line-height: 24px; border-radius: 6px;
    font-size: 13px; color: #52514e; background: rgba(252, 252, 251, 0.86);
    box-shadow: 0 0 0 1px #e1e0d9;
  }
  figcaption { color: var(--text-muted); font-size: 12.5px; margin-top: 6px; }

  details { margin-top: 12px; }
  details summary {
    cursor: pointer; color: var(--text-secondary); font-size: 13px; font-weight: 600;
    list-style: none; display: inline-flex; align-items: center; gap: 6px;
  }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: "▸"; font-size: 11px; color: var(--text-muted); }
  details[open] summary::before { content: "▾"; }
  details summary:hover { color: var(--text-primary); }
  .more-charts { margin-top: 4px; }
  dl { margin: 10px 0 0; font-size: 14px; }
  dl div { display: flex; gap: 10px; padding: 5px 0; border-top: 1px solid var(--hairline); }
  dl div:first-child { border-top: 0; }
  dt { color: var(--text-muted); flex: 0 0 34%; }
  dd { color: var(--text-secondary); margin: 0; flex: 1; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; margin: 12px 0 0; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px 14px; white-space: nowrap; }
  th { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--hairline); }
  tr + tr td { border-top: 1px solid var(--hairline); }

  .more {
    display: block; width: 100%; margin: 24px 0 0; padding: 11px;
    font: inherit; font-size: 14px; font-weight: 600; color: var(--text-primary);
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; cursor: pointer;
  }
  .more:hover { border-color: var(--text-muted); }
  .note { color: var(--text-muted); font-size: 13.5px; margin: 24px 0; }

  /* full-size viewer: fits to the screen first, click again for actual size */
  .lightbox {
    position: fixed; inset: 0; z-index: 10; display: none;
    background: rgba(0, 0, 0, 0.82);
  }
  .lightbox[open-state="on"] { display: block; }
  .lightbox .scroller {
    position: absolute; inset: 0; overflow: auto; padding: 24px;
    display: flex; align-items: center; justify-content: center; cursor: zoom-out;
  }
  .lightbox img {
    max-width: 100%; max-height: 100%; border-radius: 8px; background: #fcfcfb;
    cursor: zoom-in; flex: none;
  }
  .lightbox img.actual { max-width: none; max-height: none; cursor: zoom-out; }
  .lightbox .close {
    position: absolute; top: 12px; right: 12px; z-index: 1;
    width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
    font: inherit; font-size: 20px; line-height: 1; color: #0b0b0b;
    background: rgba(252, 252, 251, 0.92); border: 0;
  }
  /* the hint sits over the chart, which is light, so it carries its own pill */
  .lightbox .hint {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px;
    margin: 0; padding: 5px 12px; border-radius: 999px; white-space: nowrap;
    color: rgba(255, 255, 255, 0.86); background: rgba(11, 11, 11, 0.72);
    font-size: 12.5px; pointer-events: none;
  }

  @media (max-width: 560px) {
    main { padding: 18px 12px 48px; }
    .post { padding: 16px 14px; border-radius: 12px; }
    dl div { flex-direction: column; gap: 2px; }
    dt { flex: none; }
    .lightbox .scroller { padding: 12px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Blog</h1>
    <nav>
      <a href="index.html">city index</a>
      <a href="my-teams.html">my teams</a>
      <a href="groups.html">city groups</a>
      <span aria-current="page">blog</span>
      <a href="about.html">about</a>
    </nav>
  </header>
  <p class="as-of" id="as-of">Every chart the analysis jobs have drawn, newest first.</p>

  <div class="filters" id="filters" hidden></div>
  <div id="feed"></div>
  <p class="note" id="note">Loading posts…</p>
  <button class="more" id="more" hidden>Show older posts</button>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Chart" tabindex="-1">
  <button class="close" id="lightbox-close" type="button" aria-label="Close">✕</button>
  <div class="scroller" id="lightbox-scroller"><img alt=""></div>
  <p class="hint" id="lightbox-hint"></p>
</div>

<script>
const MANIFEST = "content/posts/index.json";
const PAGE = 8;                    // posts rendered per batch
const KINDS = {
  daily:       { label: "City of the day" },
  spotlight:   { label: "Out of the norm" },
  streakiness: { label: "Streakiness" },
};

let posts = [];
let filter = "all";
let shown = 0;
let lastDay = null;                // the date header currently open in the feed

const feed = document.getElementById("feed");
const note = document.getElementById("note");
const moreBtn = document.getElementById("more");
const filters = document.getElementById("filters");
const lightbox = document.getElementById("lightbox");
const lightboxImg = lightbox.querySelector("img");
const lightboxHint = document.getElementById("lightbox-hint");

const el = (tag, props = {}, kids = []) => {
  const node = Object.assign(document.createElement(tag), props);
  for (const kid of kids) if (kid) node.append(kid);
  return node;
};

// an id may not start with a digit and still be usable in a CSS selector, so
// both anchors carry a prefix: #post-2026-08-02-spotlight, #day-2026-08-02
const postId = post => `post-${post.date}-${post.kind}`;
const dayId = date => `day-${date}`;

function longDate(iso) {
  // parse as local, not UTC, so a post never renders as the day before
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined,
    { weekday: "long", year: "numeric", month: "long", day: "numeric" });
}

function figureFor(image, date) {
  const img = el("img", {
    src: `content/posts/${date}/${image.file}`,
    alt: image.alt || "",
    loading: "lazy",
    decoding: "async",
  });
  const fig = el("figure", {}, [
    el("button", { type: "button", title: "Click to enlarge",
                   onclick: event => openLightbox(img, event.currentTarget) }, [img]),
    image.caption ? el("figcaption", { textContent: image.caption }) : null,
  ]);
  // a post whose folder has been pruned shouldn't leave a broken frame behind
  img.addEventListener("error", () => fig.remove());
  return fig;
}

function numbersFor(section) {
  if (!section.stats?.length && !section.table) return null;
  const body = [];
  if (section.stats?.length) {
    body.push(el("dl", {}, section.stats.map(stat => el("div", {}, [
      el("dt", { textContent: stat.label }),
      el("dd", { textContent: stat.value }),
    ]))));
  }
  if (section.table) {
    const head = el("tr", {}, section.table.columns.map(c => el("th", { textContent: c })));
    const rows = section.table.rows.map(r =>
      el("tr", {}, r.map(cell => el("td", { textContent: cell }))));
    body.push(el("div", { className: "table-wrap" }, [
      el("table", {}, [el("thead", {}, [head]), el("tbody", {}, rows)]),
    ]));
  }
  return el("details", {}, [el("summary", { textContent: "The numbers" }), ...body]);
}

function sectionFor(section, date, lead) {
  const images = section.images || [];
  const rest = images.slice(lead);
  return el("section", { className: "finding" }, [
    section.heading ? el("h4", { textContent: section.heading }) : null,
    section.subhead ? el("p", { className: "subhead", textContent: section.subhead }) : null,
    // the numbers sit with the claim they support, not three charts below it
    numbersFor(section),
    ...images.slice(0, lead).map(image => figureFor(image, date)),
    rest.length ? el("details", { className: "more-charts" }, [
      el("summary", { textContent: `${rest.length} more chart${rest.length === 1 ? "" : "s"}` }),
      ...rest.map(image => figureFor(image, date)),
    ]) : null,
  ]);
}

function postFor(post) {
  const kind = KINDS[post.kind] || { label: post.kind };
  const badge = el("a", { className: "badge", textContent: kind.label,
                          href: `#${postId(post)}`, title: "Link to this post" });
  badge.dataset.kind = post.kind;
  // a spotlight carries three findings; showing every chart of each one makes a
  // four-screen post, so only its lead chart stays open. A single-section post
  // (a morning, the streakiness pair) is short enough to show whole.
  const lead = post.sections.length > 1 ? 1 : 2;
  return el("article", { className: "post", id: postId(post) }, [
    badge,
    el("h3", { textContent: post.title }),
    post.dek ? el("p", { className: "dek", textContent: post.dek }) : null,
    ...post.sections.map(section => sectionFor(section, post.date, lead)),
  ]);
}

function dayFor(date) {
  const head = el("h2", { className: "day-head" }, [
    el("a", { href: `#${dayId(date)}`, textContent: longDate(date) }),
  ]);
  return el("section", { className: "day", id: dayId(date) }, [head]);
}

function visible() {
  return filter === "all" ? posts : posts.filter(p => p.kind === filter);
}

function render({ reset = false } = {}) {
  if (reset) { feed.textContent = ""; shown = 0; lastDay = null; }
  const list = visible();
  const batch = list.slice(shown, shown + PAGE);
  for (const post of batch) {
    if (post.date !== lastDay) {
      feed.append(dayFor(post.date));
      lastDay = post.date;
    }
    feed.lastElementChild.append(postFor(post));
  }
  shown += batch.length;
  moreBtn.hidden = shown >= list.length;
  moreBtn.textContent = `Show older posts (${list.length - shown} left)`;
  note.hidden = list.length > 0;
  if (!list.length) note.textContent = "Nothing posted in this category yet.";
}

/** Render batches until the anchored post exists, then scroll to it. */
function revealTarget() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (!id) return;
  while (!document.getElementById(id) && shown < visible().length) render();
  document.getElementById(id)?.scrollIntoView({ block: "start" });
}

function setFilter(kind, { push = true } = {}) {
  filter = kind;
  for (const b of filters.children) {
    b.setAttribute("aria-pressed", String(b.dataset.kind === kind));
  }
  render({ reset: true });
  if (push) {
    const url = new URL(location);
    url.hash = "";
    if (kind === "all") url.searchParams.delete("kind");
    else url.searchParams.set("kind", kind);
    history.pushState({ kind }, "", url);
  }
}

function buildFilters() {
  const counts = posts.reduce((acc, p) => ({ ...acc, [p.kind]: (acc[p.kind] || 0) + 1 }), {});
  const options = [["all", `All (${posts.length})`]]
    .concat(Object.entries(KINDS)
      .filter(([kind]) => counts[kind])
      .map(([kind, meta]) => [kind, `${meta.label} (${counts[kind]})`]));
  if (options.length < 3) return;                 // one kind so far: no chips needed
  filters.hidden = false;
  for (const [kind, label] of options) {
    const button = el("button", { type: "button", textContent: label });
    button.dataset.kind = kind;
    button.setAttribute("aria-pressed", String(kind === filter));
    button.onclick = () => {
      setFilter(kind);
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
    filters.append(button);
  }
}

// --- the full-size viewer ----------------------------------------------------

let lastFocus = null;

function openLightbox(img, opener) {
  lastFocus = opener;
  lightboxImg.src = img.src;
  lightboxImg.alt = img.alt;
  lightboxImg.classList.remove("actual");
  lightbox.setAttribute("aria-label", img.alt || "Chart");
  lightboxHint.textContent = "Click the chart for actual size · Esc to close";
  lightbox.setAttribute("open-state", "on");
  document.body.style.overflow = "hidden";
  lightbox.focus();
}

function closeLightbox() {
  if (!lightbox.hasAttribute("open-state")) return;
  lightbox.removeAttribute("open-state");
  document.body.style.overflow = "";
  lastFocus?.focus();
  lastFocus = null;
}

document.getElementById("lightbox-scroller").addEventListener("click", closeLightbox);
document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
lightboxImg.addEventListener("click", event => {
  event.stopPropagation();               // clicking the chart zooms, not closes
  lightboxImg.classList.toggle("actual");
  lightboxHint.textContent = lightboxImg.classList.contains("actual")
    ? "Drag to pan · click the chart to fit · Esc to close"
    : "Click the chart for actual size · Esc to close";
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeLightbox();
  // only the close button is focusable inside the dialog, so keep Tab there
  if (event.key === "Tab" && lightbox.hasAttribute("open-state")) {
    event.preventDefault();
    document.getElementById("lightbox-close").focus();
  }
});

moreBtn.addEventListener("click", () => render());
window.addEventListener("hashchange", revealTarget);
window.addEventListener("popstate", () => {
  setFilter(new URL(location).searchParams.get("kind") || "all", { push: false });
  revealTarget();
});

fetch(MANIFEST)
  .then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)))
  .then(data => {
    posts = data.posts || [];
    if (!posts.length) {
      note.textContent = "No posts yet — the first one lands after tomorrow morning's run.";
      return;
    }
    document.getElementById("as-of").textContent =
      `${posts.length} post${posts.length === 1 ? "" : "s"}, newest first — a city of the day `
      + `every morning, the league-wide reads on Wednesdays. `
      + `The blog keeps the last ${data.retain_days || 90} days.`;
    filter = new URL(location).searchParams.get("kind") || "all";
    if (!(filter in KINDS)) filter = "all";
    buildFilters();
    render({ reset: true });
    revealTarget();
  })
  .catch(() => {
    note.textContent = "Couldn't load the posts. Try again in a moment.";
  });
</script>
</body>
</html>
