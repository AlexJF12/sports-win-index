<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City Groups — Fandom Pulse</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect x=%220.5%22 y=%229%22 width=%223.6%22 height=%226%22 rx=%221.3%22 fill=%22%23a5a49c%22/><rect x=%226.2%22 y=%225.5%22 width=%223.6%22 height=%229.5%22 rx=%221.3%22 fill=%22%236f6e69%22/><rect x=%2211.9%22 y=%221%22 width=%223.6%22 height=%2214%22 rx=%221.3%22 fill=%22%237d3ff0%22/></svg>">
<style>
  :root {
    color-scheme: light;
    --page:           #f9f9f7;
    --surface:        #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --hairline:       #e1e0d9;
    --border:         rgba(11, 11, 11, 0.10);
    --loss:           #d03b3b;
    --accent:         #7d3ff0;
    --accent-ink:     #ffffff;
    --chip:           rgba(11, 11, 11, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page:           #0d0d0d;
      --surface:        #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --hairline:       #2c2c2a;
      --border:         rgba(255, 255, 255, 0.10);
      --loss:           #d03b3b;
      --accent:         #9d6bff;
      --accent-ink:     #12071f;
      --chip:           rgba(255, 255, 255, 0.07);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 880px; margin: 0 auto; padding: 20px 20px 64px; }

  /* the brand bar, shared by every page (index, my-teams, groups, about, blog.css) */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--page) 88%, transparent);
    backdrop-filter: blur(10px) saturate(1.6);
    -webkit-backdrop-filter: blur(10px) saturate(1.6);
    border-bottom: 1px solid var(--hairline);
  }
  .bar {
    max-width: 880px; margin: 0 auto; padding: 9px 20px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 4px 16px; flex-wrap: wrap;
  }
  .wordmark {
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
    font-size: 17px; font-weight: 700; letter-spacing: -0.025em;
    color: var(--text-primary); text-decoration: none;
  }
  .wordmark svg { width: 15px; height: 15px; display: block; }
  .wordmark .b1 { fill: var(--text-muted); opacity: 0.5; }
  .wordmark .b2 { fill: var(--text-muted); }
  .wordmark .b3 { fill: var(--accent); transform-origin: 50% 100%; transition: transform 0.18s ease; }
  .wordmark:hover .b3 { transform: scaleY(1.14); }
  nav { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
  nav a {
    color: var(--text-secondary); font-size: 13px; text-decoration: none;
    padding: 5px 9px; border-radius: 999px;
    transition: color 0.15s ease, background 0.15s ease;
  }
  nav a:hover { color: var(--text-primary); background: var(--chip); }
  nav [aria-current="page"] { color: var(--text-primary); font-weight: 650; background: var(--chip); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  h1 { font-size: 25px; font-weight: 700; letter-spacing: -0.03em; margin: 0; }
  .roster .varies { color: var(--text-primary); font-weight: 600; }
  .city-card:target { outline: 2px solid var(--accent); outline-offset: 2px; }

  .intro { color: var(--text-secondary); font-size: 14px; margin: 6px 0 24px; max-width: 640px; }
  .intro .count { color: var(--text-primary); font-weight: 600; }

  .city-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; align-items: start; }
  .city-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px;
    transition: border-color 0.15s ease;
  }
  .city-card:hover { border-color: var(--text-muted); }
  .city-card.wide { grid-column: 1 / -1; }
  .city-card h2 { font-size: 15px; font-weight: 650; margin: 0; }
  .city-card .meta { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .group { padding: 7px 0; }
  .group + .group { border-top: 1px solid var(--hairline); }
  .group .gname { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
  .group .roster { font-size: 13px; color: var(--text-muted); }
  .group.single { display: flex; flex-direction: column; }
  .multi-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 0 24px; }
  #error { color: var(--loss); margin: 24px 0; display: none; }
  @media (max-width: 560px) {
    main { padding: 16px 12px 48px; }
    .bar { padding: 8px 12px; }
    nav { flex-basis: 100%; }
    h1 { font-size: 21px; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="bar">
    <a class="wordmark" href="index.html" aria-label="Fandom Pulse — home">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect class="b1" x="0.5" y="9" width="3.6" height="6" rx="1.3"/><rect class="b2" x="6.2" y="5.5" width="3.6" height="9.5" rx="1.3"/><rect class="b3" x="11.9" y="1" width="3.6" height="14" rx="1.3"/></svg>
      Fandom Pulse
    </a>
    <nav>
      <a href="index.html">Cities</a>
      <a href="my-teams.html">My teams</a>
      <a href="groups.html" aria-current="page">Groups</a>
      <a href="blog.html">Blog</a>
      <a href="about.html">About</a>
    </nav>
  </div>
</div>
<main>
  <h1>City Groups</h1>
  <p class="intro" id="intro"></p>
  <p id="error"></p>
  <div class="city-grid" id="grid"></div>
</main>

<script>
const LEAGUE_EMOJI = { mlb: "⚾", nba: "🏀", nhl: "🏒", nfl: "🏈" };

function slug(city) { return "g-" + city.toLowerCase().replace(/[^a-z0-9]+/g, "-"); }

function roster(g, varying) {
  return g.teams.map(t => {
    const txt = `${LEAGUE_EMOJI[t.league]} ${t.nickname}`;
    return varying && varying.has(t.league) ? `<span class="varies">${txt}</span>` : txt;
  }).join(" · ");
}

function render(groups) {
  const byCity = new Map();
  for (const g of groups) {
    if (!byCity.has(g.city)) byCity.set(g.city, []);
    byCity.get(g.city).push(g);
  }
  const cities = [...byCity.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  const multiCities = cities.filter(([, gs]) => gs.length > 1).length;

  document.getElementById("intro").innerHTML =
    `Every city competes as one or more <span class="count">groups</span> — one team per league. ` +
    `A city with multiple teams in the same league gets one group per combination, so no group ever ` +
    `has two teams from one league. <span class="count">${byCity.size} cities</span> · ` +
    `<span class="count">${groups.length} groups</span> · ${multiCities} cities with multiple combinations.`;

  document.getElementById("grid").innerHTML = cities.map(([city, gs]) => {
    const wide = gs.length > 4;
    // leagues where this city fields more than one team — highlight those in rosters
    const varying = new Set();
    for (const league of ["mlb", "nba", "nhl", "nfl"]) {
      const abbrs = new Set(gs.flatMap(g => g.teams.filter(t => t.league === league).map(t => t.abbr)));
      if (abbrs.size > 1) varying.add(league);
    }
    const groupsHtml = gs.map(g => `<div class="group single">
        <span class="gname">${gs.length > 1 ? g.name : ""}</span>
        <span class="roster">${roster(g, varying)}</span>
      </div>`).join("");
    return `<div class="city-card${wide ? " wide" : ""}" id="${slug(city)}">
      <h2>${city}</h2>
      <div class="meta">${gs.length === 1 ? "1 group" : `${gs.length} combinations`}
        · ${gs[0].teams.length} league${gs[0].teams.length === 1 ? "" : "s"}</div>
      ${wide ? `<div class="multi-list">${groupsHtml}</div>` : groupsHtml}
    </div>`;
  }).join("");
}

async function init() {
  try {
    const r = await fetch("city_groups.json");
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    render(await r.json());
    // cards render after fetch, so the browser's own #fragment scroll already
    // missed — do it ourselves now that the target exists
    if (location.hash) {
      const target = document.getElementById(location.hash.slice(1));
      if (target) target.scrollIntoView();
    }
  } catch (err) {
    const e = document.getElementById("error");
    e.style.display = "block";
    e.textContent = `Could not load city_groups.json (${err.message}). Serve this page over HTTP from the repo root, e.g.: python3 -m http.server`;
  }
}
init();
</script>
</body>
</html>
