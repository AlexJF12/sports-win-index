name: Daily Scores Scrape

on:
  schedule:
    # 10:00 UTC daily (~5-6am US/Eastern depending on DST) —
    # comfortably after every league's last game of the previous day finishes.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Override date (YYYYMMDD), defaults to yesterday"
        required: false

permissions:
  contents: write
  issues: write               # for failure alerting

concurrency:
  group: scrape               # a backfill and the nightly run must not push concurrently
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrape_scores.py --date "${{ inputs.date }}"

      - name: Aggregate city rankings
        run: python aggregate_cities.py

      # Two posts a day from seven types, never the same type twice running:
      # plan_posts.py picks the two, runs the analysis behind each, draws the
      # charts, files them into content/posts/<date>/ and rewrites the manifest
      # blog.html reads. The banner race is one of the seven but only on its
      # own days (the 5th, 12th, 19th, 26th and the last of the month).
      - name: Plan and publish the day's two posts
        run: python plan_posts.py --date "${{ inputs.date }}"

      # The two posts are announced on Bluesky by .github/workflows/bluesky.yml,
      # one at 15:00 UTC and one at 22:00 UTC, not from here. This job's hour is dictated by when the
      # games finish; that one's is dictated by when anybody is awake to read it.

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ content/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Add scores for ${{ inputs.date || 'yesterday' }} ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase origin "$GITHUB_REF_NAME"   # tolerate pushes that landed mid-run
          git push

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // One open issue per outage, not one per day: a source that stays
            // down otherwise files a fresh issue every morning until noticed.
            const title = "Daily scrape is failing";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Failed run: ${run}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "scrape-failure",
            });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["scrape-failure"],
              });
            }
