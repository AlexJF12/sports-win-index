name: Daily Scores Scrape

on:
  schedule:
    # 10:00 UTC daily (~5-6am US/Eastern depending on DST) —
    # comfortably after every league's last game of the previous day finishes.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Override date (YYYYMMDD), defaults to yesterday"
        required: false
      spotlight:
        description: "Also run the fandom spotlight (writes ~1 MB of images to content/<date>/)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write               # for failure alerting

concurrency:
  group: scrape               # a backfill and the nightly run must not push concurrently
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrape_scores.py --date "${{ inputs.date }}"

      - name: Aggregate city rankings
        run: python aggregate_cities.py

      - name: City of the day
        run: python city_of_the_day.py --date "${{ inputs.date }}"

      # The streakiness charts always overwrite the same two files, and the
      # numbers behind them move slowly, so a weekly refresh is plenty — daily
      # would mean a new ~300 KB of image blobs in history every morning for a
      # picture nobody would notice changing.
      - name: Weekly?
        id: cal
        run: |
          if [ "$(date -u +%u)" = "1" ]; then echo "run=true" >> "$GITHUB_OUTPUT";
          else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - name: Refresh streakiness charts
        if: steps.cal.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: python streakiness.py --date "${{ inputs.date }}"

      # Opt-in: the spotlight writes three PNGs per finding into a new dated
      # folder, so it is a manual choice rather than a standing cost.
      - name: Find fandom spotlight
        if: inputs.spotlight
        run: |
          python fandom_analysis.py --date "${{ inputs.date }}"
          python render_content.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ content/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Add scores for ${{ inputs.date || 'yesterday' }} ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase origin "$GITHUB_REF_NAME"   # tolerate pushes that landed mid-run
          git push

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // One open issue per outage, not one per day: a source that stays
            // down otherwise files a fresh issue every morning until noticed.
            const title = "Daily scrape is failing";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Failed run: ${run}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "scrape-failure",
            });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["scrape-failure"],
              });
            }
