name: Daily Scores Scrape

on:
  schedule:
    # 10:00 UTC daily (~5-6am US/Eastern depending on DST) —
    # comfortably after every league's last game of the previous day finishes.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Override date (YYYYMMDD), defaults to yesterday"
        required: false

permissions:
  contents: write
  issues: write               # for failure alerting

concurrency:
  group: scrape               # a backfill and the nightly run must not push concurrently
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrape_scores.py --date "${{ inputs.date }}"

      - name: Aggregate city rankings
        run: python aggregate_cities.py

      - name: City of the day
        run: python city_of_the_day.py --date "${{ inputs.date }}"

      # Both weekly jobs overwrite the same files, and the numbers behind them
      # move slowly, so a weekly refresh is plenty — daily would mean new image
      # blobs in history every morning for pictures nobody would see change.
      - name: Wednesday?
        id: cal
        run: |
          if [ "$(date -u +%u)" = "3" ]; then echo "run=true" >> "$GITHUB_OUTPUT";
          else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - name: Refresh streakiness charts
        if: steps.cal.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: python streakiness.py --date "${{ inputs.date }}"

      # The out-of-the-norm analysis: month-to-date against every past month
      # and against past same-months, year-to-date against the group's own
      # past years and against the field. All of it moves slowly enough that
      # a weekly read is the honest cadence.
      - name: Weekly out-of-the-norm analysis
        if: steps.cal.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python fandom_analysis.py --date "${{ inputs.date }}"
          python render_content.py

      # Every analysis above overwrites its own output, so this files each run's
      # images into content/posts/<date>/ and rewrites the manifest blog.html
      # reads. It runs daily even though the weekly folders only change on
      # Wednesdays: re-filing an unchanged folder under its own reference date
      # is a no-op, and it is what prunes posts out of the retention window.
      - name: Publish the blog
        run: python publish_blog.py

      # Runs inside the same job as the publisher, so the share lands minutes
      # after the post exists rather than on a schedule of its own that could
      # fire before it. continue-on-error because a Bluesky outage — or an
      # account that doesn't exist yet — must not cost the day's scores: the
      # post stays pending and goes out on the next run. Nothing shares until
      # BLUESKY_HANDLE and BLUESKY_APP_PASSWORD exist as repository secrets;
      # until then the script says so and exits cleanly.
      - name: Share new posts to Bluesky
        continue-on-error: true
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python share_bluesky.py

      # content/posts/bluesky.json rides along in this commit, which is what
      # keeps the next run from sharing the same post again.
      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ content/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Add scores for ${{ inputs.date || 'yesterday' }} ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase origin "$GITHUB_REF_NAME"   # tolerate pushes that landed mid-run
          git push

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // One open issue per outage, not one per day: a source that stays
            // down otherwise files a fresh issue every morning until noticed.
            const title = "Daily scrape is failing";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Failed run: ${run}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "scrape-failure",
            });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["scrape-failure"],
              });
            }
