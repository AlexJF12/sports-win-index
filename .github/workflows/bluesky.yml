name: Share to Bluesky

# The daily scrape already shares each morning's post the moment it publishes
# it. This is the hand-operated version of the same step, for the two times you
# want one: checking the setup works after the account and its secrets exist
# (start with dry_run), and reaching further back than a day when a run was
# missed or the blog is seeded from history (backfill).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be shared, post nothing"
        type: boolean
        default: true
      backfill:
        description: "Ignore the age window and consider every post in the manifest"
        type: boolean
        default: false
      max_age_days:
        description: "How far behind the newest post to reach back"
        default: "1"
      max_posts:
        description: "Ceiling on this run's shares"
        default: "4"
      share_daily:
        description: "Which city-of-the-day posts go out"
        type: choice
        default: notable
        options: [notable, always, never]

permissions:
  contents: write

concurrency:
  group: scrape        # the record of what's been shared is a file in the repo
  cancel-in-progress: false

jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --require-credentials here but not in the daily job: a run somebody
      # started by hand should say so when the secrets are missing, rather
      # than reporting green having done nothing.
      - name: Share
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          python share_bluesky.py \
            --max-age-days "${{ inputs.max_age_days }}" \
            --max-posts "${{ inputs.max_posts }}" \
            --share-daily "${{ inputs.share_daily }}" \
            ${{ inputs.backfill && '--backfill' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '--require-credentials' }}

      - name: Commit the record of what was shared
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/bluesky.json
          git diff --cached --quiet && echo "Nothing was shared" && exit 0
          git commit -m "Share posts to Bluesky ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
