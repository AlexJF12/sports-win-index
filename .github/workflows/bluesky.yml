name: Share to Bluesky

# Split off from the scrape on purpose. The scrape has to run at 10:00 UTC —
# it is timed to land after every league's last game of the previous day — and
# 10:00 UTC is 5-6am Eastern, which is close to the worst hour of the day to
# post anything. Publishing and announcing want opposite clocks, so the site
# still updates at dawn and the timeline hears about it in the evening.
#
# 22:00 UTC is 6pm Eastern in summer and 5pm in winter (3pm / 2pm Pacific):
# after work, before first pitch, inside the evening window where US social
# traffic peaks and a sports audience is already thinking about sports. Cron
# is UTC and does not follow DST, so the Eastern hour drifts by one across the
# year; that is inside the window either way, and this is one line to change.
# Treat it as a starting hypothesis — once there are a few weeks of posts,
# the account's own numbers beat any rule of thumb.

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be shared, post nothing"
        type: boolean
        default: true
      backfill:
        description: "Ignore the age window and consider every post in the manifest"
        type: boolean
        default: false
      max_age_days:
        description: "How far behind the newest post to reach back"
        default: "1"
      max_posts:
        description: "Ceiling on this run's shares"
        default: "4"
      share_daily:
        description: "Which city-of-the-day posts go out"
        type: choice
        default: notable
        options: [notable, always, never]

permissions:
  contents: write

concurrency:
  group: scrape        # the record of what's been shared is a file in the repo,
  cancel-in-progress: false   # and the scrape pushes to the same branch

jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      # the tip of the branch, which by now carries the morning's published post
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Share
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          # workflow_dispatch fills these in; a scheduled run leaves them empty
          # and falls back to the same defaults the script already has
          MAX_AGE_DAYS: ${{ inputs.max_age_days || '1' }}
          MAX_POSTS: ${{ inputs.max_posts || '4' }}
          SHARE_DAILY: ${{ inputs.share_daily || 'notable' }}
          BACKFILL: ${{ inputs.backfill && '--backfill' || '' }}
          # A run somebody started by hand should fail loudly when the secrets
          # are missing, rather than reporting green having done nothing. The
          # nightly one exits quietly, so an account that doesn't exist yet is
          # not a red X every evening.
          MODE: >-
            ${{ inputs.dry_run && '--dry-run'
                || (github.event_name == 'workflow_dispatch'
                    && '--require-credentials' || '') }}
        run: |
          python share_bluesky.py \
            --max-age-days "$MAX_AGE_DAYS" \
            --max-posts "$MAX_POSTS" \
            --share-daily "$SHARE_DAILY" \
            $BACKFILL $MODE

      - name: Commit the record of what was shared
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/bluesky.json
          git diff --cached --quiet && echo "Nothing was shared" && exit 0
          git commit -m "Share posts to Bluesky ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase origin "$GITHUB_REF_NAME"   # the scrape pushes here too
          git push
