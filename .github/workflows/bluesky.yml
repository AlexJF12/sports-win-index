name: Share to Bluesky

# Split off from the scrape on purpose. The scrape has to run at 10:00 UTC —
# it is timed to land after every league's last game of the previous day — and
# 10:00 UTC is 5-6am Eastern, which is close to the worst hour of the day to
# post anything. Publishing and announcing want opposite clocks, so the site
# still updates at dawn and the timeline hears about it in the evening.
#
# Two posts a day, one per run. 15:00 UTC is late morning Eastern (11am in
# summer, 10am in winter) and 22:00 UTC is the evening (6pm / 5pm): the first
# catches the lunch scroll, the second lands after work and before first pitch.
# Each run shares exactly one post — the oldest still waiting — so the day's
# two never go out back to back. Scheduled runs on GitHub start late, sometimes
# by hours; seven hours apart leaves room for that. Cron is UTC and does not
# follow DST, so the Eastern hours drift by one across the year.

on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be shared, post nothing"
        type: boolean
        default: true
      backfill:
        description: "Ignore the age window and consider every post in the manifest"
        type: boolean
        default: false
      max_age_days:
        description: "How far behind the newest post to reach back"
        default: "1"
      max_posts:
        description: "Ceiling on this run's shares"
        default: "1"
      prune_dead:
        description: "Delete past shares whose page is gone, instead of sharing"
        type: boolean
        default: false
      share_daily:
        description: "Which city-of-the-day posts go out"
        type: choice
        default: always
        options: [always, notable, never]

permissions:
  contents: write

concurrency:
  group: scrape        # the record of what's been shared is a file in the repo,
  cancel-in-progress: false   # and the scrape pushes to the same branch

jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      # the tip of the branch, which by now carries the morning's published post
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Share
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          # workflow_dispatch fills these in; a scheduled run leaves them empty
          # and falls back to the same defaults the script already has
          MAX_AGE_DAYS: ${{ inputs.max_age_days || '1' }}
          MAX_POSTS: ${{ inputs.max_posts || '1' }}
          SHARE_DAILY: ${{ inputs.share_daily || 'always' }}
          BACKFILL: ${{ inputs.backfill && '--backfill' || '' }}
          PRUNE: ${{ inputs.prune_dead && '--prune-dead' || '' }}
          # A run somebody started by hand should fail loudly when the secrets
          # are missing, rather than reporting green having done nothing. The
          # nightly one exits quietly, so an account that doesn't exist yet is
          # not a red X every evening.
          MODE: >-
            ${{ inputs.dry_run && '--dry-run'
                || (github.event_name == 'workflow_dispatch'
                    && '--require-credentials' || '') }}
        run: |
          python share_bluesky.py \
            --max-age-days "$MAX_AGE_DAYS" \
            --max-posts "$MAX_POSTS" \
            --share-daily "$SHARE_DAILY" \
            $BACKFILL $PRUNE $MODE

      # Runs even when the share step failed: a run that dies on its third post
      # has still shared two, and share_bluesky.py writes those to the record
      # before exiting. Dropping that record would share them again tomorrow.
      - name: Commit the record of what was shared
        if: ${{ !cancelled() && !inputs.dry_run }}
        run: |
          # no record yet means nothing has ever been shared — not an error
          [ -f content/posts/bluesky.json ] || { echo "Nothing was shared"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/bluesky.json
          git diff --cached --quiet && echo "Nothing was shared" && exit 0
          git commit -m "Share posts to Bluesky ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase origin "$GITHUB_REF_NAME"   # the scrape pushes here too
          git push
